<!-- header component -->
<app-header [selectedNavItem]="selectedNavItem"/>

<!-- Background Image -->
<div class="micro-grid-overlay"></div>

<!-- main contents -->
<main>

  <!-- shadows -->
  <div
    class="ambient-glow ambient-glow-primary"
    [style]="{
      backgroundImage: `radial-gradient(
    circle,
    rgba(${selectedNavItem?.colorRGB}, 0.22) 0%,
    rgba(130, 60, 240, 0.08) 60%,
    transparent 85%
  )`,
    }"
  ></div>
  <div
    class="ambient-glow ambient-glow-secondary"
    [style]="{
      backgroundImage: 'radial-gradient(circle, rgba(168, 85, 247, 0.14) 0%, transparent 75%)',
    }"
  ></div>
  <div
    class="ambient-glow ambient-glow-tertiary"
    [style]="{
      backgroundImage: `radial-gradient(circle, rgba(${selectedNavItem?.colorRGB}, 0.1) 0%, transparent 80%)`,
    }"
  ></div>

  <!-- brand part -->
  <div class="brand">
    <span
      class="brand-dot"
      [style]="{
        'background-color': selectedNavItem?.color,
        'box-shadow': '0 0 10px ' + selectedNavItem?.color
    }"
    ></span>
    <span class="brand-name">KHOSRAVI.DEV</span>
  </div>

  <!-- name part -->
  <div class="name-part">
    <h1>{{ selectedNavItem?.name }}</h1>
    <p>{{ selectedNavItem?.description }}</p>
  </div>

  <!-- navbar component -->
  <app-navbar [navItems]="navItems" (select)="onSelect($event)"/>
  
</main>
