<header>
  <div class="header-left">
    <span class="dot red"></span>
    <span class="dot orange"></span>
    <span class="dot green"></span>
    <span class="version-tag">v1.0.0</span>
  </div>

  <div class="header-center">
    <span class="brand-title">KHOSRAVI.DEV</span>
    <span class="separator">—</span>
    <span class="brand-tech">HTML CSS TS ANG</span>
  </div>

  <div class="header-right">
    <div class="host-pill">
      <span
        class="status-dot"
        [style]="{
          'background-color': selectedNavItem()?.color,
          'box-shadow': '0 0 8px ' + selectedNavItem()?.color,
        }"
      ></span>
      <span class="host-text">localhost</span>
    </div>
    <!-- content in max-width: 420px -->
    <div class="info">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="info-icon"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"
        />
      </svg>

      <div class="about-box">
        <div class="version-part">
          <span id="version-word">Version:</span>
          <span id="version-name">v1.0.0</span>
        </div>
        <div class="language-part">
          <span id="language-word">Languages:</span>
          <span id="language-name">HTML CSS TS ANG</span>
        </div>
      </div>
    </div>
  </div>
</header>
